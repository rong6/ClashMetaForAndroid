name: Build Fork APK

on:
  workflow_dispatch:
    inputs:
      build-type:
        description: '构建类型'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/build-fork.yaml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      
      - name: Checkout Submodules
        run: |
          git submodule update --init --recursive --force
          cd core/src/foss/golang/clash
          git fetch --unshallow || true
          cd -
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          check-latest: true

      - name: Cache Go Modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Update CA Certificates
        run: |
          sudo apt-get update && sudo apt-get install ca-certificates
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt core/src/foss/golang/clash/component/ca/ca-certificates.crt

      - name: Decode Keystore
        if: inputs.build-type == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
            echo "✅ 密钥文件已解码"
          else
            echo "⚠️  未配置 KEYSTORE_BASE64，将构建未签名版本"
          fi
      
      - name: Create Signing Properties
        if: inputs.build-type == 'release'
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_STORE_PASSWORD" ]; then
            touch signing.properties
            echo "keystore.password=$SIGNING_STORE_PASSWORD" > signing.properties
            echo "key.alias=$SIGNING_KEY_ALIAS" >> signing.properties
            echo "key.password=$SIGNING_KEY_PASSWORD" >> signing.properties
            echo "✅ 签名配置已创建"
          else
            echo "⚠️  未配置签名密钥，将构建未签名版本"
          fi

      - name: Build Debug APK
        if: inputs.build-type == 'debug' || github.event_name == 'push'
        run: ./gradlew --no-daemon app:assembleAlphaRelease

      - name: Build Release APK
        if: inputs.build-type == 'release'
        run: ./gradlew --no-daemon app:assembleMetaRelease

      - name: Get Version Info
        id: version
        run: |
          VERSION=$(grep "versionName" build.gradle.kts | sed -n 's/.*versionName = "\(.*\)".*/\1/p')
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: CMFA-${{ steps.version.outputs.version }}-universal-${{ steps.version.outputs.timestamp }}
          path: |
            app/build/outputs/apk/alpha/release/*-universal-*.apk
            app/build/outputs/apk/meta/release/*-universal-*.apk
          if-no-files-found: warn
      
      - name: Upload ARM64-v8a APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: CMFA-${{ steps.version.outputs.version }}-arm64-v8a-${{ steps.version.outputs.timestamp }}
          path: |
            app/build/outputs/apk/alpha/release/*-arm64-v8a-*.apk
            app/build/outputs/apk/meta/release/*-arm64-v8a-*.apk
          if-no-files-found: warn
      
      - name: Upload ARMeabi-v7a APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: CMFA-${{ steps.version.outputs.version }}-armeabi-v7a-${{ steps.version.outputs.timestamp }}
          path: |
            app/build/outputs/apk/alpha/release/*-armeabi-v7a-*.apk
            app/build/outputs/apk/meta/release/*-armeabi-v7a-*.apk
          if-no-files-found: warn

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: CMFA-${{ steps.version.outputs.version }}-x86_64-${{ steps.version.outputs.timestamp }}
          path: |
            app/build/outputs/apk/alpha/release/*-x86_64-*.apk
            app/build/outputs/apk/meta/release/*-x86_64-*.apk
          if-no-files-found: warn

      # 发布到 GitHub Releases（仅当推送到 main 分支时）
      - name: Delete Old Pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: dev-drprasad/delete-tag-and-release@v1.1
        with:
          tag_name: Prerelease-Fork
          github_token: ${{ secrets.GITHUB_TOKEN }}
          delete_release: true
        continue-on-error: true

      - name: Create Pre-release Tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: richardsimko/update-tag@v1
        with:
          tag_name: Prerelease-Fork
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Prerelease-Fork
          name: Fork 自动构建版本 v${{ steps.version.outputs.version }}
          body: |
            ## 🚀 Fork 自动构建版本
            
            **版本**: v${{ steps.version.outputs.version }}  
            **构建时间**: ${{ steps.version.outputs.timestamp }}  
            **构建类型**: Alpha (基于上游最新代码)
            
            ### 📦 下载说明
            
            选择适合你设备的架构：
            
            - **arm64-v8a** ⭐ - 推荐！适合大部分现代 Android 手机（2016年后）
            - **armeabi-v7a** - 32位 ARM 设备、老旧手机
            - **universal** - 通用版本，兼容所有设备，但体积较大
            - **x86_64** - 模拟器、x86 平板电脑
            
            **不确定选哪个？** → 下载 **arm64-v8a** 版本
            
            ### 🔄 自动同步
            
            此版本每天自动从上游同步最新代码并构建，包含：
            - ✅ 上游最新功能和修复
            - ✅ 自定义应用图标和资源
            - ✅ 自动化构建和发布
            
            ### ⚠️ 注意事项
            
            - 未签名版本需要在手机设置中允许"安装未知来源应用"
            - 基于上游开发分支，可能不如正式版稳定
            - 如需稳定版本，请等待上游发布正式版后再下载
            
            ---
            
            **上游项目**: [MetaCubeX/ClashMetaForAndroid](https://github.com/MetaCubeX/ClashMetaForAndroid)  
            **构建状态**: [![Build](https://github.com/${{ github.repository }}/actions/workflows/build-fork.yaml/badge.svg)](https://github.com/${{ github.repository }}/actions/workflows/build-fork.yaml)
          files: |
            app/build/outputs/apk/alpha/release/*.apk
            app/build/outputs/apk/meta/release/*.apk
          prerelease: true
          generate_release_notes: true

      - name: Build Summary
        run: |
          echo "## 构建完成 ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**版本:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**时间:** ${{ steps.version.outputs.timestamp }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 生成的 APK 文件" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          find app/build/outputs/apk -name "*.apk" -exec basename {} \; | while read file; do
            echo "- $file" >> $GITHUB_STEP_SUMMARY
          done
